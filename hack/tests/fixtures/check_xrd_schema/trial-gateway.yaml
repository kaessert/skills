# Real output from an agent given the six-question wizard instructions and this
# vendor spec, with no XRD design guidance and no checker. Kept verbatim as a
# regression fixture: every defect in it is one a competent author produced
# unprompted, not one planted by hand.
#
# It also carries both shapes the group-stutter check cannot tell apart:
# `gatewayName` references a DIFFERENT object that legitimately carries the
# group's word, and `gatewayTimeoutSeconds` is the compound term from HTTP 504.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: routes.gateway.example.com
spec:
  scope: Namespaced
  group: gateway.example.com
  names:
    kind: Route
    plural: routes
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: Desired state of an HTTP route attached to an Edgeway gateway.
              properties:
                apiId:
                  type: string
                  description: >-
                    UUID of the Edgeway API this route is attached to. Immutable:
                    changing this value detaches and re-creates the route on the
                    backend.
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "apiId is immutable: changing it detaches and re-creates the route"
                gatewayName:
                  type: string
                  description: >-
                    Name of the gateway this route belongs to. Immutable once set.
                  minLength: 3
                  maxLength: 63
                  pattern: "^[a-z][a-z0-9-]{2,62}$"
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "gatewayName is immutable"
                protocol:
                  type: string
                  description: Protocol this route serves.
                  enum:
                    - http
                    - https
                    - grpc
                pathPrefix:
                  type: string
                  description: Path prefix this route matches on the gateway.
                  maxLength: 1024
                  pattern: "^/"
                apiEndpointPort:
                  type: integer
                  description: Port on the upstream API endpoint that this route forwards to.
                  minimum: 1
                  maximum: 65535
                gatewayTimeoutSeconds:
                  type: integer
                  description: >-
                    Upstream timeout, in seconds, before the gateway returns a
                    504 Gateway Timeout.
                  minimum: 1
                  maximum: 300
                  default: 30
                cacheTtlSeconds:
                  type: integer
                  description: >-
                    Cache TTL, in seconds, for this route's responses. 0 disables
                    caching.
                  minimum: 0
                  maximum: 86400
                  default: 0
                tlsEnabled:
                  type: boolean
                  description: Whether the route terminates TLS.
                  default: false
                allowedOrigins:
                  type: array
                  description: >-
                    CORS origins allowed for this route. Order is not significant
                    and duplicate entries are rejected by the backend.
                  maxItems: 50
                  uniqueItems: true
                  default: []
                  items:
                    type: string
                dnsName:
                  type: string
                  description: Optional custom hostname for the route.
                  maxLength: 253
                  pattern: "^[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(\\.[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$"
              required:
                - apiId
                - gatewayName
                - protocol
                - pathPrefix
                - apiEndpointPort
            status:
              type: object
              description: Observed state of the route as reported by the Edgeway backend.
              properties:
                routeId:
                  type: string
                  description: Identifier generated by the backend for this route.
                resolvedUrl:
                  type: string
                  description: Full URL at which the route is reachable.
      additionalPrinterColumns:
        - name: Protocol
          type: string
          jsonPath: .spec.protocol
        - name: Path
          type: string
          jsonPath: .spec.pathPrefix
        - name: TLS
          type: boolean
          jsonPath: .spec.tlsEnabled
          priority: 1
        - name: Ready
          type: string
          jsonPath: '.status.conditions[?(@.type=="Ready")].status'
        - name: URL
          type: string
          jsonPath: .status.resolvedUrl
          priority: 1
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
